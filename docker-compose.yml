services:
  lakehouse:
    build: .
    container_name: lakehouse
    hostname: lakehouse
    ports:
      - "127.0.0.1:9083:9083"
      - "127.0.0.1:10002:10001"
      - "127.0.0.1:4041:4040"
    volumes:
      - hive_metastore:/opt/hive/metastore_db
      - ./logs:/opt/hadoop/logs
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      BUCKET_NAME: lakehouse
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/10001"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [lakehouse-net]

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: delivery_source
      MYSQL_USER: delivery
      MYSQL_PASSWORD: delivery
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lakehouse-net]

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [lakehouse-net]

  minio-init:
    image: minio/mc:RELEASE.2023-09-04T19-57-37Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/lakehouse
    networks: [lakehouse-net]

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter.Dockerfile
    container_name: jupyter
    working_dir: /home/jovyan/work
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data:ro
      - ./reports:/home/jovyan/reports:ro
      - spark_ivy:/home/jovyan/.ivy2
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MYSQL_USER: delivery
      MYSQL_PASSWORD: delivery
      PYSPARK_SUBMIT_ARGS: >-
        --master local[2]
        --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,io.delta:delta-spark_2.12:3.3.2,com.mysql:mysql-connector-j:8.0.33
        pyspark-shell
    depends_on:
      lakehouse:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks: [lakehouse-net]

  metabase:
    image: metabase/metabase:v0.50.32
    container_name: metabase
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      mysql:
        condition: service_healthy
    networks: [lakehouse-net]

volumes:
  hive_metastore:
  minio_data:
  mysql_data:
  metabase_data:
  spark_ivy:

networks:
  lakehouse-net:
    driver: bridge
