services:
  lakehouse:
    build: .
    container_name: lakehouse
    hostname: lakehouse
    ports:
      - "127.0.0.1:9083:9083"
      - "127.0.0.1:10002:10001"
      - "127.0.0.1:4041:4040"
    volumes:
      - hive_metastore:/opt/hive/metastore_db
      - ./logs:/opt/hadoop/logs
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      BUCKET_NAME: lakehouse
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/10001"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [lakehouse-net]

  mysql:
    image: mysql:8.4
    command: --performance-schema=OFF --innodb-buffer-pool-size=64M --max-connections=50
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: delivery_source
      MYSQL_USER: ${MYSQL_USER:-delivery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-delivery}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lakehouse-net]

  minio:
    image: scnd/minio-mirror:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [lakehouse-net]

  minio-init:
    image: scnd/mc-mirror:RELEASE.2025-02-04T04-57-50Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} && mc mb --ignore-existing local/lakehouse"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    networks: [lakehouse-net]

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter.Dockerfile
    container_name: jupyter
    working_dir: /home/jovyan/work
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./pipeline:/home/jovyan/pipeline
      - ./scripts:/home/jovyan/work/scripts:ro
      - ./src:/home/jovyan/work/src:ro
      - ./config:/home/jovyan/work/config:ro
      - ./tests:/home/jovyan/tests:ro
      - ./pytest.ini:/home/jovyan/pytest.ini:ro
      - ./dashboard:/home/jovyan/dashboard:ro
      - ./data:/home/jovyan/data:ro
      - ./reports:/home/jovyan/reports
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MYSQL_USER: ${MYSQL_USER:-delivery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-delivery}
      PREFECT_API_URL: http://prefect:4200/api
      PYTHONPATH: /usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip
      SPARK_IVY_DIR: /tmp/lakehouse-ivy
      PYSPARK_SUBMIT_ARGS: >-
        --master local[2]
        --driver-memory 1500m
        --conf spark.sql.execution.arrow.pyspark.enabled=true
        --conf spark.sql.shuffle.partitions=8
        --conf spark.jars.ivy=/tmp/lakehouse-ivy
        --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,io.delta:delta-spark_2.12:3.3.2,com.mysql:mysql-connector-j:8.0.33
        pyspark-shell
    depends_on:
      lakehouse:
        condition: service_healthy
      mysql:
        condition: service_healthy
      prefect:
        condition: service_healthy
    networks: [lakehouse-net]

  prefect:
    build:
      context: .
      dockerfile: docker/jupyter.Dockerfile
    container_name: prefect
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
    ports:
      - "127.0.0.1:4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [lakehouse-net]

  dashboard:
    build: ./dashboard
    container_name: dashboard
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-delivery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-delivery}
      MYSQL_DB: delivery_source
    volumes:
      - ./dashboard:/app
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [lakehouse-net]

  metabase:
    image: metabase/metabase:v0.50.32
    container_name: metabase
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      mysql:
        condition: service_healthy
    networks: [lakehouse-net]

volumes:
  hive_metastore:
  minio_data:
  mysql_data:
  metabase_data:
  spark_ivy:
  prefect_data:

networks:
  lakehouse-net:
    driver: bridge
