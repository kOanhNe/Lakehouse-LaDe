services:
  lakehouse:
    build: .
    container_name: lakehouse
    hostname: lakehouse
    ports:
      - "9083:9083"   # Hive Metastore (thrift)
      - "10002:10001" # Spark Thrift Server - JDBC port
      - "4040:4040"   # Spark Application UI
    volumes:
      - hive_metastore:/opt/hive/metastore_db
      - ./notebooks:/opt/spark/work-dir
      - ./logs:/opt/hadoop/logs   # mount logs ra ngoài để debug
    depends_on:
      - minio
      - mysql
    networks:
      - lakehouse-net
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - BUCKET_NAME=lakehouse   # tên bucket mặc định

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: delivery_source
    ports:
      - "3306:3306"
    networks:
      - lakehouse-net

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net

  # --- Service Jupyter mới để chạy notebook ---
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_OPTS=--master local[*] \
          --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,io.delta:delta-spark_2.12:3.3.2,mysql:mysql-connector-java:8.0.33 \
          --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
          --conf spark.hadoop.fs.s3a.access.key=minioadmin \
          --conf spark.hadoop.fs.s3a.secret.key=minioadmin \
          --conf spark.hadoop.fs.s3a.path.style.access=true \
          --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
          --conf spark.sql.warehouse.dir=s3a://lakehouse/warehouse \
          --conf spark.hadoop.hive.metastore.uris=thrift://lakehouse:9083 \
          --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
          --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
    depends_on:
      - lakehouse
      - minio
    networks:
      - lakehouse-net

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2 # Sử dụng DB nội bộ cho nhẹ, hoặc trỏ sang MySQL nếu muốn lưu data vĩnh viễn
    depends_on:
      - lakehouse
    networks:
      - lakehouse-net

volumes:
  hive_metastore:
  minio_data:

networks:
  lakehouse-net:
    driver: bridge